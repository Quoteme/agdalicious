name: Build and release agdalicious-lsp

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GHC_VERSION: "9.10"
  # the Agda whose user manual the hover texts come from (as in flake.nix)
  AGDA_VERSION: "2.8.0"

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-aarch64
          - os: macos-latest
            target: macos-aarch64
          - os: windows-latest
            target: windows-x86_64
    defaults:
      run:
        shell: bash
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Set up GHC and cabal
        id: setup
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: latest

      - name: Resolve dependencies
        run: |
          cabal update
          cabal configure --enable-optimization=2
          cabal build --dry-run

      - name: Cache cabal store
        uses: actions/cache@v4
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ runner.os }}-${{ runner.arch }}-ghc-${{ steps.setup.outputs.ghc-version }}-${{ hashFiles('server/dist-newstyle/cache/plan.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-ghc-${{ steps.setup.outputs.ghc-version }}-

      - name: Generate hover texts from the Agda user manual
        working-directory: .
        run: |
          curl -sSL "https://github.com/agda/agda/archive/refs/tags/v${AGDA_VERSION}.tar.gz" | tar xz
          mkdir -p server/data
          "$(command -v python3 || command -v python)" scripts/gen-manual.py \
            "agda-${AGDA_VERSION}/doc/user-manual" scripts/doc-sources.json > server/data/manual.json

      - name: Build
        run: cabal build exe:agdalicious-lsp

      - name: Package binary
        id: package
        run: |
          bin="$(cabal list-bin exe:agdalicious-lsp)"
          name="agdalicious-lsp-${{ matrix.target }}"
          mkdir -p "../dist/$name"
          cp ../README.md "../dist/$name/"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp "$bin" "../dist/$name/agdalicious-lsp.exe"
            (cd ../dist && 7z a "$name.zip" "$name" > /dev/null)
            echo "asset=dist/$name.zip" >> "$GITHUB_OUTPUT"
          else
            cp "$bin" "../dist/$name/agdalicious-lsp"
            strip "../dist/$name/agdalicious-lsp"
            (cd ../dist && tar -czf "$name.tar.gz" "$name")
            echo "asset=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: agdalicious-lsp-${{ matrix.target }}
          path: ${{ steps.package.outputs.asset }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
